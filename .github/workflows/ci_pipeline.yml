name: Python CI Pipeline - Sistem Perpustakaan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_perpustakaan
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: 1. Mengambil Kode dari Repositori (Checkout)
      uses: actions/checkout@v4

    - name: 2. Menyiapkan Lingkungan Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        update-environment: true

    - name: 3. Menginstal Dependensi Tanpa Build
      run: |
        python -m pip install --upgrade pip
        pip install --prefer-binary -r requirements.txt

    - name: 4. Menjalankan Automated Unit Testing (Pytest)
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: db_perpustakaan
      run: |
        python -c "
        import mysql.connector
        conn = mysql.connector.connect(host='127.0.0.1', user='root', password='root')
        cursor = conn.cursor()
        cursor.execute('CREATE DATABASE IF NOT EXISTS db_perpustakaan;')
        cursor.execute('USE db_perpustakaan;')
        cursor.execute('CREATE TABLE IF NOT EXISTS buku (id INT AUTO_INCREMENT PRIMARY KEY, judul VARCHAR(255), penulis VARCHAR(255));')
        conn.close()
        "
        python -m pytest -v